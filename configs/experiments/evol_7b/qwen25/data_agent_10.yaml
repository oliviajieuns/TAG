# Qwen2.5-7B + Evol-Instruct + Data Agent (Yang et al., ICML 2026) at 10% — Table 5.
#
# 실행:
#   source scripts/setup_env.sh
#   CUDA_VISIBLE_DEVICES=0 python -m baselines.data_agent.train \
#       --config configs/experiments/evol_7b/qwen25/data_agent_10.yaml \
#       --tag DataAgent-PPO
defaults:
  - configs/base.yaml
  - configs/methods/data_agent.yaml
  - configs/models/qwen2.5-7b.yaml
  - configs/modes/full_ft.yaml

output_subdir: evol_7b/qwen25/data_agent_10
selection_ratio: 0.1
train_epochs: 3

data_files: ${oc.env:EVOL_INSTRUCT_DATA_FILES,/group-volume/IT-datasets/wizardlm_evol_instruct_70k/*.json}
dataset_name: WizardLMTeam/WizardLM_evol_instruct_70k
