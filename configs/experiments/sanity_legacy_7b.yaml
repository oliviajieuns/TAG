# Phase-0 sanity check: Qwen2.5-7B + LoRA + 5K subset, 1 epoch.
defaults:
  - configs/base.yaml
  - configs/methods/legacy.yaml
  - configs/models/qwen2.5-7b.yaml
  - configs/modes/lora.yaml

output_subdir: sanity/sanity_legacy_7b
selection_ratio: 0.5
train_epochs: 1
dataset_subset_size: 5000

lora:
  r: 8
  alpha: 16

anchor:
  layer_idx: -1
  max_samples_for_pca: 512
  pca_batch_size: 4
