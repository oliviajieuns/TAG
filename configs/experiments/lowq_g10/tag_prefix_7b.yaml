# Grounded-pool dose-response arm, 10% corruption: TAG, prefix contrast.
#
# One of the lowq_g{10,20,30,40,50} family — see the legacy_7b file beside
# this one for the family's purpose, and lowq/tag_prefix_7b for the measured
# rationale behind prefix_tokens=32 / tail_mode=none.
#
# gate_cache_file is per-rate: G is a property of (pool, base checkpoint,
# gate config), and each rate is a different pool. Build it once per rate:
#   bash scripts/precompute_gate.sh configs/experiments/lowq_g10/tag_prefix_7b.yaml \
#       $POOLS/grounded10/tag_gate_qwen2.5-7b_prefix.pt
# gate_ref_file is backbone-bound and shared by the whole family.
defaults:
  - configs/methods/tag.yaml
  - configs/experiments/lowq/_shared_7b.yaml

output_subdir: lowq_g10/tag_prefix_7b
data_files: ${oc.env:POOLS,}/grounded10/pool.json
selection:
  tag:
    counterfactual_data_files: ${oc.env:POOLS,}/grounded10/counterfactual.json
    prefix_tokens: 32
    tail_mode: none
    gate_ref_file: ${oc.env:TAG_GATE_REF_7B_PREFIX,}
    gate_cache_file: ${oc.env:POOLS,}/grounded10/tag_gate_qwen2.5-7b_prefix.pt
    store_token_losses: true
