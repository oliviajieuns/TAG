# Lowq arm: MVF-STATIC control — the v3 score computed ONCE at epoch 1,
# selection frozen for every later refresh. Isolates the training-adaptive
# component (per-refresh D/A recomputation) from the score design; without
# this arm, "adaptive beats static" is unfalsifiable (plan §5.1 arm 6).
# Same env wiring as light_mvf_05b.yaml.
# Order matters: method FIRST, shared fragment LAST (see
# light_mvf_05b.yaml note; verified by tests/test_lowq_configs.py).
defaults:
  - configs/methods/mvf.yaml
  - configs/experiments/lowq/_shared_light_05b.yaml

output_subdir: lowq/mvf_static_05b
selection:
  mvf:
    static: true
