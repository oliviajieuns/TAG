# Low-quality-pool baseline arm: OLD TADS score (uncertainty-carrying
# composite reward, paper Eq. 10) on the SAME corrupted pool as
# light_tads_mvf_05b.yaml. Only ALPACA_DATA_FILES is needed — the legacy
# score uses no counterfactual pool or dedup clusters.
defaults:
  - configs/base.yaml
  - configs/methods/tads.yaml
  - configs/models/qwen2.5-0.5b.yaml
  - configs/modes/lora.yaml

output_subdir: lowq/tads_legacy_05b
selection_ratio: 0.1
train_epochs: 5
batch_size: 4
grad_accum: 2
episode_batch_size: 2

lora:
  r: 8
  alpha: 16
  dropout: 0.05

anchor:
  layer_idx: -1
  max_samples_for_pca: 512
  pca_batch_size: 4
