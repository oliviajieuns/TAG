# SHARED training fragment for every 0.5B low-quality-pool arm.
#
# WHY THIS FILE EXISTS (plan §5.2, CIKM lesson §2.3): the previous paper
# died partly because one method silently ran with its own optimizer
# settings (fp32 AdamW / warmup 0.06 / clip 0.5 on LLaMA-2-7B TADS only),
# which made "only the selected subset differs" false. Every lowq arm MUST
# inherit optimizer / precision / scheduler / batch / epochs from exactly
# this one file; arm overlays may set ONLY the selection method and its
# score parameters. Never override training hyperparameters in an arm
# file — if a value needs to change, change it HERE so every arm moves
# together.
defaults:
  - configs/base.yaml
  - configs/models/qwen2.5-0.5b.yaml
  - configs/modes/lora.yaml

selection_ratio: 0.1
# 5 epochs (vs the clean-pool default 3) so the per-refresh selected-dirty-
# fraction curve has enough resolution (plan §5.3).
train_epochs: 5
batch_size: 4
grad_accum: 2
# Scoring-forward batch. Method fragments (configs/methods/tads*.yaml) set
# their own episode_batch_size: 16 for the 7B experiments — the lowq arm
# files list the METHOD FIRST and this fragment LAST so this value wins
# (adversarial review 2026-08: the reverse order silently resolved to 16,
# ~8x activation memory on the light GPU class).
episode_batch_size: 2

lora:
  r: 8
  alpha: 16
  dropout: 0.05

anchor:
  layer_idx: -1
  max_samples_for_pca: 512
  pca_batch_size: 4
