# Lowq arm: TAG (proposed method) on a corrupted pool — the reliability gate
# multiplying the intact trajectory-anchored score (paper Eq. 1).
# Point the env vars at a pool generated by scripts/make_corrupted_pool.py:
#
#   python scripts/make_corrupted_pool.py \
#       --input $ALPACA_RAW_JSON --out-dir $POOLS/composite20 \
#       --preset composite20 --duplicate-frac 0.05 --seed 42 \
#       --emit-counterfactual --emit-dedup-clusters
#   export ALPACA_DATA_FILES=$POOLS/composite20/pool.json
#   export TADS_CF_FILES=$POOLS/composite20/counterfactual.json
#   export TADS_DEDUP_FILE=$POOLS/composite20/dedup_clusters.json
#   export TADS_GATE_REF=$POOLS/clean_ref/delta_hat_05b.pt   # calibration
#
# The calibration reference is produced on a CLEAN pool with
#   python scripts/calibrate_reliability.py --mode tag \
#       --config configs/experiments/lowq/light_tag_05b.yaml \
#       --data-files $POOLS/clean_ref/pool.json \
#       --cf-files $POOLS/clean_ref/counterfactual.json \
#       --out $POOLS/clean_ref/delta_hat_05b.pt
#
# Training hyperparameters come ONLY from _shared_light_05b.yaml (plan §5.2
# — no per-arm overrides, ever).
# Order matters: method FIRST, shared fragment LAST, so the shared
# training pins (episode_batch_size etc.) override the method file's
# 7B-scale values. Verified by tests/test_lowq_configs.py.
defaults:
  - configs/methods/tag.yaml
  - configs/experiments/lowq/_shared_light_05b.yaml

output_subdir: lowq/tag_05b
