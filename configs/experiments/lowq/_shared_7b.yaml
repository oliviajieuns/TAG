# SHARED training fragment for every 7B low-quality-pool arm.
#
# Same contract as _shared_light_05b.yaml (plan §5.2, CIKM lesson §2.3):
# every arm inherits optimizer / precision / scheduler / batch / epochs from
# THIS file, and arm overlays may set ONLY the selection method and its score
# parameters. If a value needs to change, change it here so every arm moves
# together — an arm that silently ran with its own optimizer settings is what
# made "only the selected subset differs" false in the previous paper.
#
# Differences from the 0.5B fragment, and why:
#   - full fine-tuning instead of LoRA. Pre-registered in plan §5.3 as a
#     deliberate scale difference, not an accident: the 0.5B grid answers
#     curve-resolution questions and the 7B run confirms the endpoint.
#   - 3 epochs, not 5 (plan §5.3). The per-refresh dirty-fraction curve is
#     the 0.5B grid's job; 7B is there to show the endpoint holds.
defaults:
  - configs/base.yaml
  - configs/models/qwen2.5-7b.yaml
  - configs/modes/full_ft.yaml

selection_ratio: 0.1
train_epochs: 3

# full_ft.yaml sizes these for DDP x 4 x 80GB (per-GPU 8 x accum 4 x ws 4 =
# effective 128) and turns on 8-bit AdamW, without which the optimizer state
# alone (~56 GB fp32) does not fit beside the weights.
#
# The DEFAULT here is one arm per GPU, not one arm across four, because
# selection runs on rank 0 only (see tads/pipelines/selection.py): DDP speeds
# up the SFT step but not the 30-90 min per-epoch scoring pass, so three of
# four GPUs would idle for most of a 7B run. Running four arms concurrently,
# one per GPU, keeps every card busy. DDP replicates the full model, grads
# and optimizer per rank anyway, so per-GPU memory is identical either way.
#
# effective batch = batch_size(8) x grad_accum x world_size, held at 128:
#   one arm per GPU  (world_size 1) -> grad_accum 16   <- default
#   one arm on 4 DDP (world_size 4) -> grad_accum 4    -> export TADS_GRAD_ACCUM_7B=4
grad_accum: ${oc.env:TADS_GRAD_ACCUM_7B,16}

# Forward-only scoring batch. 7B activations are ~14x the 0.5B ones, so the
# default is lower than the 0.5B arm's H100 setting. Raise it once, in the
# shell that launches EVERY arm:
#     export TADS_EPISODE_BS_7B=32
# Each run records the resolved value in its cfg snapshot.
episode_batch_size: ${oc.env:TADS_EPISODE_BS_7B,8}

anchor:
  layer_idx: -1
  max_samples_for_pca: 1024
  pca_batch_size: 16
