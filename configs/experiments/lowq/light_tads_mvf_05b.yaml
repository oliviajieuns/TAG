# Low-quality-pool experiment (Qwen2.5-0.5B, LoRA) — TADS-MVF on a
# corrupted pool. Point the env vars at a pool generated by
# scripts/make_corrupted_pool.py, e.g.:
#
#   python scripts/make_corrupted_pool.py \
#       --input $ALPACA_RAW_JSON --out-dir $POOLS/composite20 \
#       --preset composite20 --duplicate-frac 0.05 --seed 42 \
#       --emit-counterfactual --emit-dedup-clusters
#   export ALPACA_DATA_FILES=$POOLS/composite20/pool.json
#   export TADS_CF_FILES=$POOLS/composite20/counterfactual.json
#   export TADS_DEDUP_FILE=$POOLS/composite20/dedup_clusters.json
#
# 5 epochs (vs the clean-pool default 3) so the per-refresh selected-dirty-
# fraction curve has enough resolution (plan §1.2 / §4).
defaults:
  - configs/base.yaml
  - configs/methods/tads_mvf.yaml
  - configs/models/qwen2.5-0.5b.yaml
  - configs/modes/lora.yaml

output_subdir: lowq/tads_mvf_05b
selection_ratio: 0.1
train_epochs: 5
batch_size: 4
grad_accum: 2
episode_batch_size: 2

lora:
  r: 8
  alpha: 16
  dropout: 0.05

anchor:
  layer_idx: -1
  max_samples_for_pca: 512
  pca_batch_size: 4
