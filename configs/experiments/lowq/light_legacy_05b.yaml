# Lowq arm: OLD legacy score (uncertainty-carrying composite reward, paper
# Eq. 10) on the SAME corrupted pool as light_mvf_05b.yaml. Only
# ALPACA_DATA_FILES is needed — the legacy score uses no counterfactual
# pool or dedup clusters. Guarded bit-identical by
# tests/test_selector_regression.py.
# Training hyperparameters come ONLY from _shared_light_05b.yaml.
# Order matters: method FIRST, shared fragment LAST (see
# light_mvf_05b.yaml note; verified by tests/test_lowq_configs.py).
defaults:
  - configs/methods/legacy.yaml
  - configs/experiments/lowq/_shared_light_05b.yaml

output_subdir: lowq/legacy_05b
