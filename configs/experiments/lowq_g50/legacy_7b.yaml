# Grounded-pool dose-response arm, 50% corruption: legacy score, no gate.
#
# One of the lowq_g{10,20,30,40,50} family — identical arms on identical
# recipes, differing ONLY in how much corruption was injected (mismatch and
# EDA-noisy at 25% each; --preset grounded50, seed 42). The family
# exists to measure the dose-response of the gate: at what corruption level
# selection separates, and what that buys downstream.
#
# Paths are self-contained (derived from $POOLS) so a shell pointed at the
# wrong rate cannot leak in; scripts/check_row_pair.py guards the pair.
defaults:
  - configs/methods/legacy.yaml
  - configs/experiments/lowq/_shared_7b.yaml

output_subdir: lowq_g50/legacy_7b
data_files: ${oc.env:POOLS,}/grounded50/pool.json
