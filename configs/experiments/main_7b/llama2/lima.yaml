# Llama-2-7B + LIMA (Zhou et al., 2023) — pure data-replacement SFT
#
# 실행:
#   source scripts/setup_env.sh
#   # 데이터: huggingface-cli login + GAIR/lima access 동의
#   # 또는 export LIMA_DATA_FILES=/path/to/lima.json
#   CUDA_VISIBLE_DEVICES=0 python -m baselines.lima.train \
#       --config configs/experiments/main_7b/llama2/lima.yaml \
#       --tag LIMA
defaults:
  - configs/base.yaml
  - configs/methods/lima.yaml
  - configs/models/llama2-7b.yaml
  - configs/modes/full_ft.yaml

output_subdir: main_7b/llama2/lima
# Cross-method 비교를 위해 legacy-score/data_agent와 동일하게 3으로 고정.
train_epochs: 3
