# Llama-2-7B + Alpaca-GPT4 + SelectIT baseline at 10% selection (full fine-tune)
#
# 실행:
#   source scripts/setup_env.sh
#   CUDA_VISIBLE_DEVICES=0 python -m baselines.selectit.train \
#       --config configs/experiments/main_7b/llama2/selectit_10.yaml \
#       --tag SelectIT-Token
#
# 평가는 별도 root로:
#   python -m tads.eval \
#       --config configs/experiments/main_7b/llama2/selectit_10.yaml \
#       --ckpt ${OUTPUT_ROOT}/main_7b/llama2/selectit_10/epoch_3 \
#       --benchmarks mmlu,mmlu_pro,gsm8k,svamp,humaneval,mbpp,tydiqa,xquad,bbh \
#       --out_dir ${SELECTIT_EVAL_RESULTS_ROOT}/llama2/selectit_10/
defaults:
  - configs/base.yaml
  - configs/methods/selectit.yaml
  - configs/models/llama2-7b.yaml
  - configs/modes/full_ft.yaml

output_subdir: main_7b/llama2/selectit_10
selection_ratio: 0.1
# Cross-method 비교를 위해 TADS/data_agent와 동일하게 3으로 고정.
train_epochs: 3
