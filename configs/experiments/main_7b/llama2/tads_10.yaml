# Llama-2-7B + Alpaca-GPT4 + TADS (paper Eq.8, anchor on) at 10% selection
#
# Score: s_i = R̃_i · (1 + λ · ã_i)   (paper Eq.8)
#   R̃_i = σ((R_i - R̄) / (σ_R + 1e-6))   calibrated utility
#   ã_i = min-max-norm( (1/L) Σ_l <h̄_l(x_i), v_l> )   sequence-mean alignment
# PPO actor 완전 제거 — 모든 step이 deterministic pool-level 통계.
defaults:
  - configs/base.yaml
  - configs/methods/tads.yaml
  - configs/models/llama2-7b.yaml
  - configs/modes/full_ft.yaml

output_subdir: main_7b/llama2/tads_10
selection_ratio: 0.1
# epochs-reset(2026-05-16): 4 → 3. NAIT/대다수 IT-SFT 논문(Alpaca, LIMA, NAIT Table 8 등)이 3 epoch을 기준으로 보고하므로 매트릭스 전 셀을 3으로 환원해 baseline 비교 가능성 확보.
train_epochs: 3
