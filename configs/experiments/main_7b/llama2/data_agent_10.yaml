# Llama-2-7B + Alpaca-GPT4 + Data Agent (Yang et al., ICML 2026) at 10% selection
#
# 실행:
#   source scripts/setup_env.sh
#   CUDA_VISIBLE_DEVICES=0 python -m baselines.data_agent.train \
#       --config configs/experiments/main_7b/llama2/data_agent_10.yaml \
#       --tag DataAgent-PPO
#
# 평가 (별도 root):
#   python -m tads.eval \
#       --config configs/experiments/main_7b/llama2/data_agent_10.yaml \
#       --ckpt ${OUTPUT_ROOT}/main_7b/llama2/data_agent_10/data_agent_dataagent_ppo/epoch_last \
#       --benchmarks mmlu,mmlu_pro,gsm8k,svamp,humaneval,mbpp,tydiqa,xquad,bbh \
#       --out_dir ${EVAL_RESULTS_ROOT}/main_7b/llama2/data_agent_10/

defaults:
  - configs/base.yaml
  - configs/methods/data_agent.yaml
  - configs/models/llama2-7b.yaml
  - configs/modes/full_ft.yaml

output_subdir: main_7b/llama2/data_agent_10
selection_ratio: 0.1
# epochs-reset(2026-05-16): 4 → 3. NAIT/대다수 IT-SFT 논문(Alpaca, LIMA, NAIT Table 8 등)이 3 epoch을 기준으로 보고하므로 매트릭스 전 셀을 3으로 환원해 baseline 비교 가능성 확보.
train_epochs: 3
