# Llama-2-7B + Alpaca-GPT4 random 10% — NAIT paper Table 2 System 06 reproduction
# Expected: MMLU ≈ 47.14, AVG ≈ 35.69 (paper Table 2 row "01 + Random Baseline")
defaults:
  - configs/base.yaml
  - configs/methods/random.yaml
  - configs/models/llama2-7b.yaml
  - configs/modes/full_ft.yaml

output_subdir: main_7b/llama2/random_10
selection_ratio: 0.1
# epochs-reset(2026-05-16): 4 → 3. NAIT/대다수 IT-SFT 논문(Alpaca, LIMA, NAIT Table 8 등)이 3 epoch을 기준으로 보고하므로 매트릭스 전 셀을 3으로 환원해 baseline 비교 가능성 확보.
train_epochs: 3
