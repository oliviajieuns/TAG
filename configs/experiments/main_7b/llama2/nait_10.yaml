# Llama-2-7B + Alpaca-GPT4 + NAIT baseline at 10% selection (full fine-tune)
#
# 실행 (시드 파일 없으면 ALPACA_DATA_FILES에서 자동 1500-sample 후 seeds/mix_auto.json에 cache):
#   source scripts/setup_env.sh
#   CUDA_VISIBLE_DEVICES=0 python -m tads.baselines.nait.train \
#       --config configs/experiments/main_7b/llama2/nait_10.yaml \
#       --tag NAIT-Mix
#
# 또는 자체 seed JSON 있으면:
#       --seed_path /path/to/seeds.json   를 추가
#
# 평가는 별도 root로:
#   python -m tads.eval \
#       --config configs/experiments/main_7b/llama2/nait_10.yaml \
#       --ckpt ${OUTPUT_ROOT}/main_7b/llama2/nait_10/nait_nait_mix/epoch_3 \
#       --benchmarks mmlu,mmlu_pro,gsm8k,svamp,humaneval,mbpp,tydiqa,xquad,bbh \
#       --out_dir ${NAIT_EVAL_RESULTS_ROOT}/llama2/nait_10/
defaults:
  - configs/base.yaml
  - configs/methods/nait.yaml
  - configs/models/llama2-7b.yaml
  - configs/modes/full_ft.yaml

output_subdir: main_7b/llama2/nait_10
selection_ratio: 0.1
# Cross-method 비교를 위해 TADS/data_agent와 동일하게 3으로 고정 (base default와 동일).
train_epochs: 3
