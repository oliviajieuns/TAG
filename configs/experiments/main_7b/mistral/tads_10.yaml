# Mistral-7B + Alpaca-GPT4 + TADS (λ=1, anchor on) at 10% selection
defaults:
  - configs/base.yaml
  - configs/methods/tads.yaml
  - configs/models/mistral-7b.yaml
  - configs/modes/full_ft.yaml

output_subdir: main_7b/mistral/tads_10
selection_ratio: 0.1
# epochs-reset(2026-05-16): 4 → 3. NAIT/대다수 IT-SFT 논문(Alpaca, LIMA, NAIT Table 8 등)이 3 epoch을 기준으로 보고하므로 매트릭스 전 셀을 3으로 환원해 baseline 비교 가능성 확보.
train_epochs: 3

anchor:
  layer_idx: -1
  max_samples_for_pca: 1024
  pca_batch_size: 16
