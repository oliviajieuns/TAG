# base.yaml — Common configuration shared by all methods.
# Method/model/mode YAMLs override these via the `defaults:` chain.

# --- Paths (override via env vars or experiment YAML) ---
model_path: ${oc.env:MODEL_PATH,/group-volume/nait-models/Llama-2-7b-hf}
data_cache: ${oc.env:DATA_CACHE,/group-volume/minsoo3.kim/tads-checkpoints/cache}
output_root: ${oc.env:OUTPUT_ROOT,/group-volume/minsoo3.kim/tads-checkpoints}
# Optional explicit log dir (default: <output_dir>/logs)
# log_dir: ./logs

# --- Benchmark data dirs (used by `python -m tads.eval`) ---
mmlu_data_dir: ${oc.env:MMLU_DATA_DIR,/group-volume/IT-datasets/mmlu/all}
mmlu_pro_data_dir: ${oc.env:MMLU_PRO_DATA_DIR,/group-volume/IT-datasets/mmlu_pro}
gsm8k_data_dir: ${oc.env:GSM8K_DATA_DIR,/group-volume/IT-datasets/gsm8k}
svamp_data_dir: ${oc.env:SVAMP_DATA_DIR,/group-volume/IT-datasets/svamp}
humaneval_data_dir: ${oc.env:HUMANEVAL_DATA_DIR,/group-volume/IT-datasets/human-eval}
mbpp_data_dir: ${oc.env:MBPP_DATA_DIR,/group-volume/IT-datasets/mbpp}
tydiqa_data_dir: ${oc.env:TYDIQA_DATA_DIR,/group-volume/IT-datasets/tydiqa}
xquad_data_dir: ${oc.env:XQUAD_DATA_DIR,/group-volume/IT-datasets/xquad}
bbh_data_dir: ${oc.env:BBH_DATA_DIR,/group-volume/IT-datasets/bbh}

# --- Dataset (Alpaca-GPT4 by default; matches NAIT ICLR 2026, Peng et al. 2023) ---
# Precedence:
#   1. If ALPACA_DATA_FILES env var is set → load that local file (or glob).
#      Format is auto-detected from extension: .parquet / .json / .jsonl / .csv.
#   2. Else → fall back to `dataset_name` from HF hub.
# The default below is a glob over the canonical cluster layout, so any of
#   data/train.json | data/train-00000-of-...json | data/*.parquet
# will resolve without further configuration. Override by exporting
# ALPACA_DATA_FILES before launching training.
data_files: ${oc.env:ALPACA_DATA_FILES,/group-volume/IT-datasets/alpaca_gpt4/data/*.json}
dataset_name: ${oc.env:ALPACA_DATASET_NAME,liangxin/Alpaca_GPT4}
prompt_style: alpaca_default
max_seq_len: 1024

# --- Training ---
seed: 42
train_epochs: 3
batch_size: 2
grad_accum: 4
learning_rate: 2.0e-5
warmup_ratio: 0.03
weight_decay: 0.1
gradient_clip: 1.0
gradient_checkpointing: true
training_mode: full   # full | lora
# 8-bit AdamW (bitsandbytes). Set true for full FT 7B on A100 80GB to avoid OOM.
use_8bit_optimizer: false
# Attention backend: null (let HF pick), "sdpa", "flash_attention_2", "eager".
# flash_attention_2 needs `pip install flash-attn` and gives ~30% speedup; the
# loader falls back to sdpa if the import fails.
attn_implementation: null

# --- Selection ---
selection_ratio: 0.5
episode_batch_size: 1

# --- Trajectory Anchor (used by tads) ---
#
# Per-layer anchor v_l aggregates across the full decoder stack.
# `layer_indices` controls which decoder layers contribute:
#   "all"            → every decoder layer (paper-faithful, recommended)
#   "middle_to_last" → layers L//2 .. L-1 (≈half memory; our own ablation)
#   [0, 5, 10, ...]  → explicit list of decoder-layer indices
#   null / unset     → falls back to legacy single-layer mode via layer_idx
# `layer_idx` is kept only for backward compatibility with single-layer runs.
# Scoring formula at runtime is TADS Eq.6 (sequence-mean alignment) for TADS
# and NAIT Eq.5 (Δh alignment) for NAIT — both share the same v_l extraction.
anchor:
  layer_indices: all
  layer_idx: -1
  # Probe subset size (paper §3.3). Paper specifies 1024.
  max_samples_for_pca: 1024
  pca_batch_size: 4

# --- LoRA (only used when training_mode == lora) ---
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
