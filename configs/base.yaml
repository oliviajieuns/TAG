# base.yaml — Common configuration shared by all methods.
# Method/model/mode YAMLs override these via the `defaults:` chain.

# --- Paths (override via env vars or experiment YAML) ---
model_path: ${oc.env:MODEL_PATH,/group-volume/nait-models/Llama-2-7b-hf}
data_cache: ${oc.env:DATA_CACHE,/group-volume/minsoo3.kim/tads-checkpoints/cache}
output_root: ${oc.env:OUTPUT_ROOT,/group-volume/minsoo3.kim/tads-checkpoints}
# Optional explicit log dir (default: <output_dir>/logs)
# log_dir: ./logs

# --- Benchmark data dirs (used by `python -m tads.eval`) ---
mmlu_data_dir: ${oc.env:MMLU_DATA_DIR,/group-volume/IT-datasets/mmlu/all}
gsm8k_data_dir: ${oc.env:GSM8K_DATA_DIR,/group-volume/IT-datasets/gsm8k}
humaneval_data_dir: ${oc.env:HUMANEVAL_DATA_DIR,/group-volume/IT-datasets/human-eval}
tydiqa_data_dir: ${oc.env:TYDIQA_DATA_DIR,/group-volume/IT-datasets/tydiqa}

# --- Dataset (Alpaca-GPT4 by default; matches NAIT ICLR 2026, Peng et al. 2023) ---
# Precedence:
#   1. If ALPACA_DATA_FILES env var is set → load that local parquet/json.
#   2. Else → fall back to `dataset_name` from HF hub.
# Example (local file):
#   export ALPACA_DATA_FILES=/group-volume/IT-datasets/alpaca_gpt4/train.parquet
data_files: ${oc.env:ALPACA_DATA_FILES,/group-volume/IT-datasets/alpaca_gpt4/train.parquet}
dataset_name: ${oc.env:ALPACA_DATASET_NAME,liangxin/Alpaca_GPT4}
prompt_style: alpaca_default
max_seq_len: 512

# --- Training ---
seed: 42
train_epochs: 3
batch_size: 2
grad_accum: 4
learning_rate: 2.0e-5
warmup_ratio: 0.03
weight_decay: 0.1
gradient_clip: 1.0
gradient_checkpointing: true
training_mode: full   # full | lora
# 8-bit AdamW (bitsandbytes). Set true for full FT 7B on A100 80GB to avoid OOM.
use_8bit_optimizer: false
# Attention backend: null (let HF pick), "sdpa", "flash_attention_2", "eager".
# flash_attention_2 needs `pip install flash-attn` and gives ~30% speedup; the
# loader falls back to sdpa if the import fails.
attn_implementation: null

# --- Selection ---
selection_ratio: 0.5
episode_batch_size: 1

# --- PPO Agent (used by tads, data_agent) ---
agent:
  lr: 3.0e-4
  clip_eps: 0.2
  gamma: 0.99
  gae_lam: 0.95
  ppo_epochs: 4
  entropy_coef: 0.01
  value_coef: 0.5
  mb_size: 1024
  advantage_mode: group_relative
  value_clip: true

# --- Trajectory Anchor (used by tads) ---
anchor:
  layer_idx: -1
  max_samples_for_pca: 2000
  pca_batch_size: 4

# --- LoRA (only used when training_mode == lora) ---
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
