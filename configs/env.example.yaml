# env.example.yaml — Copy to env.yaml or export as env vars.
# Used by ${oc.env:VAR,default} interpolation in base.yaml.

# Where models live (one path per family — set whichever you use)
# export MODEL_PATH=/group-volume/nait-models/Llama-2-7b-hf
# export MODEL_PATH_QWEN25_7B=/group-volume/nait-models/qwen2.5-7b
# export MODEL_PATH_QWEN25_14B=/group-volume/jieuns/models/Qwen2.5-14B

# Cache + output roots
# export DATA_CACHE=/user-volume/tads/cache
# export OUTPUT_ROOT=/group-volume/jieuns/cikm2026_tads/checkpoints

# Optional Hugging Face mirror
# export HF_ENDPOINT=https://hf-mirror.com

# --- Alpaca-GPT4 IT dataset ---
# Default (when neither var is set): HF hub `liangxin/Alpaca_GPT4` (paper footnote 2)
#
# Override with a local parquet/json file (skips HF hub entirely):
# export ALPACA_DATA_FILES=/group-volume/IT-datasets/alpaca_gpt4/data/train-00000-of-00001-6ef3991c06080e14.parquet
#
# Or switch to a different HF hub dataset name (e.g. vicgalle/alpaca-gpt4):
# export ALPACA_DATASET_NAME=vicgalle/alpaca-gpt4
