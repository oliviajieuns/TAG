model_key: llama2-7b
model_path: ${oc.env:MODEL_PATH_LLAMA2_7B,/group-volume/nait-models/Llama-2-7b-hf}
# LLAMA-TUNE: switched from llama_user_assistant → alpaca_default to match
# NAIT paper Table 2 row "01 Alpaca-GPT4" (Stanford Alpaca template). The
# `<|user|>`/`<|assistant|>` tokens aren't in base Llama-2's vocabulary, so
# the previous template added cold-start cost during SFT. See LLAMA_TUNING.md.
prompt_style: alpaca_default
# NAIT Table 8: max_length=512 (Alpaca-GPT4 samples fit comfortably).
max_seq_len: 512
# NAIT Table 8 / Stanford Alpaca SFT recipe.
learning_rate: 2.0e-5
# LLAMA-TUNE 2차 조정: flash_attention_2 OOM 회피 — workspace 할당이 일부
# 환경에서 SFT/eval 양쪽에서 OOM을 유발해 sdpa(transformers 기본)으로 환원.
# 속도 손실 대비 안정성 우선. 다시 켜려면 flash-attn 버전을 torch와 맞춘 뒤
# 아래 줄 주석 해제할 것.
# attn_implementation: flash_attention_2
