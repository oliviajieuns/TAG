[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tag"
version = "0.1.0"
description = "Training-Adaptive data selection with a reliability Gate"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "datasets>=2.14",
    "peft>=0.10",  # only needed for LoRA mode; full-FT imports it lazily
    "accelerate>=0.25",
    "pyyaml>=6.0",
    "numpy>=1.24,<2.0",
    "tqdm>=4.66",
    "sentencepiece",
    "bitsandbytes>=0.43",
    # Cross-process serialisation for concurrent training jobs sharing
    # the Alpaca dataset cache (tag/data/alpaca.py).
    "filelock>=3.12",
]

[project.optional-dependencies]
eval = [
    "lm-eval>=0.4",
    "pandas",
    # pyarrow is the engine pandas.read_parquet uses — every parquet-backed
    # eval (mmlu, mmlu_pro, gsm8k, svamp, mbpp, tydiqa) fails without it.
    "pyarrow>=14.0",
    # HumanEval functional-correctness scorer. Imported lazily by
    # tag.evals.humaneval; missing-import is caught and surfaces a clear
    # RuntimeError so the other 8 benches still run.
    "human-eval>=1.0",
]
test = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tag*"]
exclude = ["tests*", "scripts*"]
